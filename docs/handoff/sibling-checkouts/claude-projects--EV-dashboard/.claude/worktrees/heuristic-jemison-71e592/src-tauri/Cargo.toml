[package]
name = "ev-dashboard"
version = "0.1.0"
description = "Canadian EV/PHEV/EREV comparison desktop app"
authors = ["Ian McAdam"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
