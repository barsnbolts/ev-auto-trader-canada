[package]
name = "ev-trader-ca"
version = "0.1.0"
description = "EV Auto Trader Canada — personal-use macOS shell"
authors = ["Ian McAdam"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "ev_trader_ca_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.2", features = ["NSString", "NSThread"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
